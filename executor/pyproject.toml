[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geolake-executor"
version = "0.1.0"
description = "geolake async query/workflow executor (dask worker)"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# pydantic>=2 (aligned). geokube/dask/numpy and the datastore packages
# (datastore, workflow, geoquery, dbmanager) come from the base image.
dependencies = ["pika==1.2.1", "prometheus_client", "SQLAlchemy", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = { "" = "app" }
py-modules = ["main", "messaging", "meta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that require geokube/real data (run in-image)"]
