[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geolake-datastore"
version = "0.1.0"
description = "geolake datastore libraries (datastore, workflow, dbmanager, geoquery, utils)"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Deps esplicite: requirements.txt aveva networkx/pydantic/psycopg2/intake;
# PyYAML e SQLAlchemy erano implicite (dbmanager le importa) → ora dichiarate.
# geokube NON è dichiarato: arriva dall'immagine base (drivers→geokube), non da PyPI.
dependencies = [
    "networkx",
    "pydantic>=2",
    "psycopg2-binary",
    "intake==2.0.9",
    "PyYAML",
    "SQLAlchemy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["datastore*", "workflow*", "dbmanager*", "geoquery*", "utils*"]
exclude = ["tests*", "*.tests*"]

[tool.pytest.ini_options]
# geoquery/tests = unit (geokube-free); tests/ = workflow + integration
testpaths = ["geoquery/tests", "tests"]
markers = ["integration: test che richiedono geokube/dati reali (eseguiti in-image)"]
