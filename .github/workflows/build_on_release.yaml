name: Build geolake docker images for geolake components and push to the repository

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install components (editable) with dev extras
      run: pip install -e ./drivers -e ./datastore -e "./api[dev]" -e "./executor[dev]"
    - name: Run unit tests (geokube-free), per component
      # Per-componente: ogni invocazione carica il pyproject del componente
      # (marker registrati) ed evita la collisione del modulo top-level `main`
      # (definito sia da api che da executor).
      run: |
        pytest api/tests -m "not integration"
        pytest datastore/geoquery/tests -m "not integration"
        pytest executor/tests -m "not integration"
        pytest drivers/tests -m "not integration"
  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Login to Scaleway Container Registry
      uses: docker/login-action@v2
      with:
        username: ${{ vars.GEOLAKE_REGISTRY }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build drivers + datastore images locally (geokube presente)
      run: |
        docker build -t local/geolake-drivers:ci \
          --build-arg REGISTRY=${{ vars.GEOKUBE_REGISTRY }} \
          --build-arg GEOKUBE_TAG=${{ vars.GEOKUBE_TAG || '2026.03.1' }} \
          ./drivers
        docker build -t local/geolake-datastore:ci \
          --build-arg REGISTRY=local --build-arg TAG=ci ./datastore
    - name: Run integration tests inside the datastore image
      run: |
        docker run --rm -v ${{ github.workspace }}:/src -w /src local/geolake-datastore:ci \
          sh -c "pip install -e ./drivers -e ./datastore -e './api[dev]' -e './executor[dev]' --break-system-packages && pytest drivers/tests -m integration && pytest datastore/tests -m integration"
  build:
    needs: [test, integration]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.x"
    - name: Install build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source for drivers
      run: python3 -m build ./drivers
    - name: Get release tag
      run: echo "RELEASE_TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
    - name: Login to Scaleway Container Registry
      uses: docker/login-action@v2
      with:
        username: ${{ vars.GEOLAKE_REGISTRY }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        #registry: ${{ vars.GEOLAKE_REGISTRY }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    - name: Build and push drivers
      uses: docker/build-push-action@v5
      with:
        context: ./drivers
        file: ./drivers/Dockerfile
        push: true
        build-args: |
          REGISTRY=${{ vars.GEOKUBE_REGISTRY  }}
          GEOKUBE_TAG=${{ vars.GEOKUBE_TAG || '2026.03.1' }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        tags: |
          ${{ vars.GEOLAKE_REGISTRY }}/geolake-drivers:${{ env.RELEASE_TAG }}
    - name: Build and push datastore component
      uses: docker/build-push-action@v5
      with:
        context: ./datastore
        file: ./datastore/Dockerfile
        push: true
        build-args: |
          REGISTRY=${{ vars.GEOLAKE_REGISTRY  }}
          TAG=${{ env.RELEASE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        tags: |
          ${{ vars.GEOLAKE_REGISTRY }}/geolake-datastore:${{ env.RELEASE_TAG }}
    - name: Build and push api component
      uses: docker/build-push-action@v5
      with:
        context: ./api
        file: ./api/Dockerfile
        push: true
        build-args: |
          REGISTRY=${{ vars.GEOLAKE_REGISTRY  }}
          TAG=${{ env.RELEASE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        tags: |
          ${{ vars.GEOLAKE_REGISTRY }}/geolake-api:${{ env.RELEASE_TAG }}
    - name: Build and push executor component
      uses: docker/build-push-action@v5
      with:
        context: ./executor
        file: ./executor/Dockerfile
        push: true
        build-args: |
          REGISTRY=${{ vars.GEOLAKE_REGISTRY  }}
          TAG=${{ env.RELEASE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        tags: |
          ${{ vars.GEOLAKE_REGISTRY }}/geolake-executor:${{ env.RELEASE_TAG }}
